name: Apply search media snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage-2-live-data
    paths:
      - scripts/apply-search-media-snapshot.ts
      - .github/workflows/apply-search-media-snapshot.yml

permissions:
  contents: write

concurrency:
  group: kudaidem-apply-search-media
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-2-live-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Apply search media snapshot to current catalog
        run: npx tsx scripts/apply-search-media-snapshot.ts

      - name: Validate exact 200 places and photos
        run: REQUIRE_LIVE_DATA=1 REQUIRE_PHOTOS=1 npm run data:validate

      - name: Audit catalog integrity
        run: npm run data:audit

      - name: Commit media-enriched catalog
        run: |
          git config user.name "kudaidem-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/khabarovsk-places.json data/scrape-report.json data/photo-review.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: attach search media to 200 Khabarovsk places [skip ci]"
            git pull --rebase origin agent/stage-2-live-data
            git push origin HEAD:agent/stage-2-live-data
          fi
