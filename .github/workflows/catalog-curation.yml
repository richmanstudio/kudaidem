name: Curate Khabarovsk catalog

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage-2-live-data
    paths:
      - data/catalog-curation-trigger.txt

permissions:
  contents: write

concurrency:
  group: kudaidem-catalog-curation
  cancel-in-progress: true

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-2-live-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsx scripts/curate-khabarovsk.ts
      - run: REQUIRE_LIVE_DATA=1 npm run data:validate
      - run: npx tsx scripts/audit-catalog.ts
      - name: Commit curated catalog
        run: |
          git config user.name "kudaidem-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/khabarovsk-places.json data/curation-report.json
          if git diff --cached --quiet; then
            echo "No curation changes"
          else
            git commit -m "data: curate Khabarovsk places [skip ci]"
            git pull --rebase origin agent/stage-2-live-data
            git push origin HEAD:agent/stage-2-live-data
          fi
