name: Refresh Khabarovsk places

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage-2-live-data
    paths:
      - package.json
      - scripts/collect-khabarovsk.ts
      - scripts/finalize-khabarovsk-catalog.ts
      - scripts/fill-review-photos.ts
      - scripts/validate-places.ts
      - .github/workflows/data-refresh.yml

permissions:
  contents: write

concurrency:
  group: kudaidem-khabarovsk-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_PLACES: "200"
      TARGET_PHOTOS: "200"
      PHOTO_FALLBACK_DELAY_MS: "260"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-2-live-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Enrich places from open and official photo sources
        id: photo_enrich
        continue-on-error: true
        run: npm run data:collect

      - name: Finalize exactly 200 current places
        id: finalize
        run: npm run data:finalize

      - name: Fill missing photos with matched 2GIS review sources
        id: photo_fallback
        run: npm run data:photos

      - name: Validate 200 places and 200 photos
        id: validate
        run: REQUIRE_LIVE_DATA=1 REQUIRE_PHOTOS=1 npm run data:validate

      - name: Preserve collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khabarovsk-catalog-report
          path: |
            data/khabarovsk-places.json
            data/scrape-report.json
            data/photo-review.json
            data/photo-fallback-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit verified 200-place / 200-photo catalog
        if: steps.finalize.outcome == 'success' && steps.photo_fallback.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          git config user.name "kudaidem-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/khabarovsk-places.json data/scrape-report.json data/photo-review.json data/photo-fallback-report.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "data: refresh 200 Khabarovsk places and photos [skip ci]"
            git pull --rebase origin agent/stage-2-live-data
            git push origin HEAD:agent/stage-2-live-data
          fi

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          echo "## Khabarovsk data refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- Open/official enrichment: ${{ steps.photo_enrich.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base 200-place finalizer: ${{ steps.finalize.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Targeted photo fallback: ${{ steps.photo_fallback.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 200-place / 200-photo gate: ${{ steps.validate.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/photo-fallback-report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/photo-fallback-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
