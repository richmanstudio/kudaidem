name: Refresh Khabarovsk places

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage-2-live-data
    paths:
      - package.json
      - scripts/collect-khabarovsk.ts
      - scripts/validate-places.ts
      - .github/workflows/data-refresh.yml

permissions:
  contents: write

concurrency:
  group: kudaidem-khabarovsk-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_PLACES: "200"
      TARGET_PHOTOS: "200"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-2-live-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Collect current places and photo provenance
        id: collect
        continue-on-error: true
        run: npm run data:collect
      - name: Validate production catalog
        id: validate
        continue-on-error: true
        run: REQUIRE_LIVE_DATA=1 npm run data:validate
      - name: Preserve collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khabarovsk-catalog-report
          path: |
            data/khabarovsk-places.json
            data/scrape-report.json
            data/photo-review.json
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified catalog
        if: steps.collect.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          git config user.name "kudaidem-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/khabarovsk-places.json data/scrape-report.json data/photo-review.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "data: refresh 200 Khabarovsk places [skip ci]"
            git pull --rebase origin agent/stage-2-live-data
            git push origin HEAD:agent/stage-2-live-data
          fi
      - name: Enforce collection gate
        if: always()
        run: |
          test "${{ steps.collect.outcome }}" = "success"
          test "${{ steps.validate.outcome }}" = "success"
