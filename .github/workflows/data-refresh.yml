name: Refresh Khabarovsk places

on:
  workflow_dispatch:
  push:
    branches:
      - agent/stage-2-live-data
    paths:
      - package.json
      - scripts/scrape-khabarovsk.ts
      - scripts/validate-places.ts
      - .github/workflows/data-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_PLACES: "200"
      SCRAPE_DELAY_MS: "300"
      DGIS_API_KEY: ${{ secrets.DGIS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-2-live-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run data:scrape
      - run: REQUIRE_LIVE_DATA=1 npm run data:validate
      - name: Commit refreshed catalog
        run: |
          git config user.name "kudaidem-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/khabarovsk-places.json data/scrape-report.json
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git commit -m "data: refresh 200 Khabarovsk places [skip ci]"
            git push origin HEAD:agent/stage-2-live-data
          fi
