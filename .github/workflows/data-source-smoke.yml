name: Data source smoke

on:
  push:
    branches:
      - agent/stage-2-live-data
    paths:
      - .github/workflows/data-source-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check 2GIS search HTML
        shell: bash
        run: |
          set -euo pipefail
          SEARCH='https://2gis.ru/khabarovsk/search/%D0%A0%D0%B5%D1%81%D1%82%D0%BE%D1%80%D0%B0%D0%BD%D1%8B'
          curl -L --fail --max-time 15 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' "$SEARCH" -o /tmp/search.html
          test $(wc -c < /tmp/search.html) -gt 1000
          COUNT=$(grep -o '/khabarovsk/firm/[0-9]\+' /tmp/search.html | sort -u | wc -l)
          echo "firm_links=$COUNT"
          test "$COUNT" -gt 0
      - name: Check 2GIS firm HTML
        shell: bash
        run: |
          set -euo pipefail
          FIRM='https://2gis.ru/khabarovsk/firm/70000001018785310/tab/info'
          curl -L --fail --max-time 15 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' "$FIRM" -o /tmp/firm.html
          test $(wc -c < /tmp/firm.html) -gt 1000
          grep -qi 'Эхо\|Волочаевская' /tmp/firm.html
          echo "firm_html_ok=1"
