name: Enrich place details
on:
  workflow_dispatch:
  push:
    branches: [agent/stage-2-live-data]
    paths:
      - scripts/enrich-place-details.ts
permissions:
  contents: write
concurrency:
  group: kudaidem-place-details
  cancel-in-progress: true
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-2-live-data
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Enrich contacts, hours, prices and ratings
        run: npx tsx scripts/enrich-place-details.ts
      - name: Validate catalog
        run: REQUIRE_LIVE_DATA=1 REQUIRE_PHOTOS=1 npm run data:validate
      - name: Audit catalog
        run: npm run data:audit
      - name: Commit enriched details
        run: |
          git config user.name "kudaidem-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/khabarovsk-places.json data/details-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: enrich Khabarovsk place details [skip ci]"
          git pull --rebase origin agent/stage-2-live-data
          git push origin HEAD:agent/stage-2-live-data
